x-pulse-logging: &pulse-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    logging: *pulse-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
      POSTGRES_USER: ${POSTGRES_USER:-pulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_local_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pulse_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulse_user} -d ${POSTGRES_DB:-pulse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    logging: *pulse-logging
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - PULSE_DATABASE_URL=postgresql://${POSTGRES_USER:-pulse_user}:${POSTGRES_PASSWORD:-pulse_local_password_change_me}@postgres:5432/${POSTGRES_DB:-pulse}
      - DATABASE_SSL=disable
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pulse_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    logging: *pulse-logging
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=/api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./SSL:/etc/nginx/ssl:ro
    depends_on:
      - backend
    networks:
      - pulse_network
    restart: unless-stopped

networks:
  pulse_network:
    driver: bridge

volumes:
  postgres_data:
